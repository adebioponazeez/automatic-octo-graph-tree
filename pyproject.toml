[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "octo-harness"
version = "1.0.0"
description = "Cowork & Grok AI Router Engine - Multi-Model Orchestration & Fallback Cascades"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "adebioponazeez" }
]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
octo-harness = "octo_harness.cli.main:main"
grok-harness = "octo_harness.cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
